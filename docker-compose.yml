services:
  webui:
    build: .
    container_name: codex-console-production
    shm_size: "1gb"
    ports:
      - "16670:1455"
      - "6080:6080"
    environment:
      - WEBUI_HOST=0.0.0.0
      - WEBUI_PORT=1455
      - DISPLAY=:99
      - ENABLE_VNC=1
      - VNC_PORT=5900
      - NOVNC_PORT=6080
      - DEBUG=0
      - LOG_LEVEL=info
      - WEBUI_ACCESS_PASSWORD=${WEBUI_ACCESS_PASSWORD:?set WEBUI_ACCESS_PASSWORD before docker compose up}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
